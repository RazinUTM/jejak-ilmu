name: Segerak bank soalan (Google Sheets → Supabase)
on:
  schedule: [{ cron: "0 20 * * *" }]   # 04:00 MYT setiap hari
  workflow_dispatch:
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: cd tools && npm ci --omit=dev || npm i
      - run: cd tools && node import_bank.mjs --url "$BANK_CSV_URL" --sp "$SP_CSV_URL" --pelajaran "$PELAJARAN_CSV_URL"
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE: ${{ secrets.SUPABASE_SERVICE_ROLE }}
          BANK_CSV_URL: ${{ secrets.BANK_CSV_URL }}
          SP_CSV_URL: ${{ secrets.SP_CSV_URL }}
          PELAJARAN_CSV_URL: ${{ secrets.PELAJARAN_CSV_URL }}
